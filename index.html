<style>
/* Layout: full-screen app shell in iOS style. Glass nav bar on top, scrolling content, floating glass toolbar at the bottom; all padded by safe-area insets. */
:root{
  /* iOS system colors */
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#F2F2F7; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --fg:#000000; --fg2:rgba(60,60,67,.6); --fg3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.18);
  --muted:#8A8A8E;
  --accent:#007AFF; --accent-ink:#FFFFFF; --accent-soft:rgba(0,122,255,.12);
  --done:#34C759; --warn:#FF9500; --danger:#FF3B30;
  --glass:rgba(249,249,251,.72); --glass-line:rgba(0,0,0,.08); --shadow:0 8px 30px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);
  /* chart colors */
  --c-work:#B9D7FB; --c-work-ink:#0A5BC4; --c-idle:#E5E5EA; --c-inc:#34C759; --c-rl:#1C1C1E; --c-rl-ink:#FFFFFF;
  --c-ds:#FF9F0A; --c-turn:#FF3B30; --c-edge:#C7C7CC; --c-rib:#D5B8F2; --c-rib2:#EADCF9; --c-hole:#FF9F0A;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --r-card:22px; --r-cell:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32);
  --fg:#FFFFFF; --fg2:rgba(235,235,245,.6); --fg3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55);
  --muted:#8D8D93;
  --accent:#0A84FF; --accent-ink:#FFFFFF; --accent-soft:rgba(10,132,255,.18);
  --done:#30D158; --warn:#FF9F0A; --danger:#FF453A;
  --glass:rgba(30,30,32,.7); --glass-line:rgba(255,255,255,.1); --shadow:0 8px 30px rgba(0,0,0,.5);
  --c-work:#1F4E86; --c-work-ink:#BFDcFF; --c-idle:#2C2C2E; --c-inc:#30D158; --c-rl:#E5E5EA; --c-rl-ink:#000000;
  --c-ds:#FF9F0A; --c-turn:#FF453A; --c-edge:#48484A; --c-rib:#7A4FA8; --c-rib2:#4A3466; --c-hole:#FF9F0A;
  color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.3 var(--f-ui);letter-spacing:-.022em;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
.ico{display:inline-flex;flex:none}
.ico svg{display:block}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.sec{color:var(--fg2)}
.foot{font-size:13px;letter-spacing:-.005em;color:var(--fg2)}
.sub{font-size:15px;letter-spacing:-.015em}

/* shell */
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-top:calc(var(--sat) + 52px)}
.scroll.has-bar{padding-bottom:calc(var(--sab) + 96px)}
.page{padding:6px max(16px,var(--sal)) 32px max(16px,var(--sar));display:grid;gap:22px;max-width:680px;margin:0 auto}
.page>*{min-width:0}

/* glass nav bar */
.nav{position:fixed;left:0;right:0;top:0;z-index:10;padding:calc(var(--sat) + 4px) max(8px,var(--sal)) 4px max(8px,var(--sar));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;min-height:calc(var(--sat) + 52px);transition:background .2s,box-shadow .2s}
.nav.solid,.nav.scrolled{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 .5px 0 var(--sep)}
.nav .l{justify-self:start;display:flex;gap:4px}
.nav .r{justify-self:end;display:flex;gap:8px}
.nav .t{text-align:center;min-width:0;max-width:56vw;opacity:0;transition:opacity .2s}
.nav.scrolled .t,.nav.always .t{opacity:1}
.nav .t b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .t small{display:block;font-size:12px;color:var(--fg2);letter-spacing:0}
.nav .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent}
.nav .prog>i{display:block;height:100%;background:var(--done);transition:width .3s}
.back{display:inline-flex;align-items:center;gap:2px;height:44px;padding:0 10px 0 4px;color:var(--accent);font-size:17px}
.gbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--glass-line),0 2px 10px rgba(0,0,0,.06)}
.gbtn.cap{width:auto;padding:0 16px 0 12px;border-radius:22px;gap:6px;display:inline-flex;align-items:center;font-weight:600;font-size:15px}
.gbtn:active,.back:active{opacity:.55}

/* titles */
.hero-title{display:grid;gap:4px;padding-top:4px}
.large{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.01em}
.title1{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.005em}
.eyebrow{font-size:15px;color:var(--fg2);font-weight:500}

/* cards & grouped lists */
.card{background:var(--surface);border-radius:var(--r-card);padding:18px;display:grid;gap:14px}
.card.tight{padding:14px}
.group{display:grid;gap:7px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;padding:0 18px;font-size:13px;text-transform:uppercase;letter-spacing:.01em;color:var(--fg2)}
.ghead button{color:var(--accent);text-transform:none;font-size:15px;letter-spacing:-.015em}
.list{background:var(--surface);border-radius:var(--r-card);overflow:hidden}
.cell{display:flex;align-items:center;gap:14px;min-height:52px;padding:10px 16px 10px 18px;width:100%;text-align:left;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:var(--inset,18px);height:.5px;background:var(--sep)}
.cell.has-ic{--inset:62px}
button.cell:active{background:var(--fill)}
.cell .grow{flex:1;min-width:0;display:grid;gap:2px}
.cell .grow b{font-weight:400}
.cell .tail{color:var(--fg2);display:flex;align-items:center;gap:6px;font-size:17px}
.cell .chev{color:var(--fg3)}
.cell.danger{color:var(--danger)}
.ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--warn);color:#fff;font-size:13px;font-weight:600;display:inline-grid;place-items:center}

/* buttons */
.btn{height:52px;border-radius:26px;padding:0 22px;font-size:17px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:var(--accent-ink);transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.tint{background:var(--accent-soft);color:var(--accent)}
.btn.gray{background:var(--fill);color:var(--fg)}
.btn.green{background:var(--done);color:#fff}
.btn.small{height:36px;border-radius:18px;font-size:15px;padding:0 14px;width:auto}
.link{color:var(--accent);font-size:15px;display:inline-flex;align-items:center;gap:4px;justify-self:start}
.link:active{opacity:.5}

/* progress */
.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .v{font-family:var(--f-round);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--done);transition:width .3s}

/* library */
.pcard{display:flex;align-items:center;gap:16px;text-align:left;width:100%}
.pcard:active{opacity:.7}
.pcard .grow{flex:1;min-width:0;display:grid;gap:3px}
.pcard h2{font-size:20px;line-height:25px;font-weight:600;letter-spacing:-.02em}
.empty{text-align:center;display:grid;gap:12px;justify-items:center;padding:48px 24px}

/* overview hero */
.hero{display:grid;gap:18px}
.hero-top{display:flex;align-items:center;gap:18px}
.hero-top .grow{display:grid;gap:4px;min-width:0}
.hero-top b{font-size:20px;font-weight:600;letter-spacing:-.02em}
.btns{display:grid;gap:10px}

/* step */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:600;letter-spacing:0;height:26px;padding:0 10px;border-radius:13px;background:var(--fill);color:var(--fg2);display:inline-flex;align-items:center;gap:4px}
.chip.blue{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:color-mix(in srgb,var(--done) 16%,transparent);color:var(--done)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.lead{font-size:19px;line-height:1.38;letter-spacing:-.02em}
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chead .foot{text-transform:uppercase;letter-spacing:.01em}
.hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px;background:var(--surface2);scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll canvas{display:block}
.ops{margin:0;padding:0;list-style:none}
.ops li{display:flex;gap:14px;align-items:flex-start;padding:11px 18px;position:relative;font-size:16px;line-height:1.35}
.ops li+li::before{content:"";position:absolute;top:0;right:0;left:50px;height:.5px;background:var(--sep)}
.ops li i{width:18px;height:18px;border-radius:5px;flex:none;margin-top:1px}
.counts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.counts div{background:var(--surface2);border-radius:12px;padding:8px 2px}
.counts b{display:block;font-family:var(--f-round);font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:0}
.counts small{font-size:11px;color:var(--fg2);line-height:1.2;display:block;letter-spacing:0}
.video{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--fg2)}
.video .ico{color:var(--accent)}
details.more{background:var(--surface);border-radius:var(--r-card)}
details.more summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px 0 18px;cursor:pointer;color:var(--fg)}
details.more summary::-webkit-details-marker{display:none}
details.more summary .chev{margin-left:auto;color:var(--fg3);transition:transform .2s}
details.more[open] summary .chev{transform:rotate(90deg)}
details.more .body{padding:0 18px 18px;display:grid;gap:10px;font-size:15px;line-height:1.45;color:var(--fg2)}
.orig{font-family:var(--f-mono);font-size:13px;letter-spacing:0;line-height:1.5;background:var(--surface2);border-radius:12px;padding:12px;word-break:break-word;color:var(--fg2)}

/* counter */
.counter{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:8px;text-align:center}
.counter .n{font-family:var(--f-round);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.counter .n small{font-size:20px;color:var(--fg2);font-weight:600;letter-spacing:0}
.counter button{width:64px;height:64px;border-radius:50%;background:var(--fill);color:var(--accent);display:grid;place-items:center;transition:transform .1s}
.counter button:active{transform:scale(.92);background:var(--fill2)}
.counter button.plus{background:var(--accent);color:#fff}
.ticks{display:flex;gap:3px}
.ticks i{flex:1;height:6px;border-radius:3px;background:var(--fill)}
.ticks i.on{background:var(--done)}

/* bottom toolbar */
.toolbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px max(16px,var(--sal)) calc(var(--sab) + 10px) max(16px,var(--sar));display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center;pointer-events:none;background:linear-gradient(to top,var(--bg) 40%,transparent)}
.toolbar>*{pointer-events:auto}
.toolbar .round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--glass-line),var(--shadow)}
.toolbar .round:disabled{color:var(--fg3)}
.toolbar .btn{box-shadow:var(--shadow)}
.toolbar .btn.soft{background:var(--glass);color:var(--accent);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--glass-line),var(--shadow)}

/* sheets */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.3);animation:fade .25s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(var(--sat) + 12px);z-index:21;background:var(--bg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.9,.25,1);box-shadow:0 -2px 30px rgba(0,0,0,.15);max-width:720px;margin:0 auto}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--fg3);margin:6px auto 0;flex:none}
.sheet .shead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 8px 6px 16px;flex:none}
.sheet .shead b{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.sheet .shead .done{justify-self:end;color:var(--accent);font-weight:600;height:44px;padding:0 10px}
.sheet .scroll{padding-top:4px;padding-bottom:calc(var(--sab) + 24px)}
.asheet{position:fixed;left:max(8px,var(--sal));right:max(8px,var(--sar));bottom:calc(var(--sab) + 8px);z-index:21;display:grid;gap:8px;animation:up .3s cubic-bezier(.2,.9,.25,1);max-width:520px;margin:0 auto}
.asheet .list{border-radius:16px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
.asheet .msg{padding:14px 18px;text-align:center;font-size:13px;color:var(--fg2);letter-spacing:0}
.asheet .act{display:block;width:100%;height:56px;font-size:20px;letter-spacing:-.02em;color:var(--accent);position:relative}
.asheet .act+.act::before,.asheet .msg+.act::before{content:"";position:absolute;top:0;left:0;right:0;height:.5px;background:var(--sep)}
.asheet .act.danger{color:var(--danger)}
.asheet .act.cancel{font-weight:600;background:var(--surface);border-radius:16px}
.asheet .act:active{background:var(--fill)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.slide-l{animation:sl .24s ease-out}.slide-r{animation:sr .24s ease-out}
@keyframes sl{from{transform:translateX(36px);opacity:.3}to{transform:none;opacity:1}}
@keyframes sr{from{transform:translateX(-36px);opacity:.3}to{transform:none;opacity:1}}
.zoom{display:flex;gap:8px}
.zoom button{width:36px;height:36px;border-radius:50%;background:var(--fill);color:var(--accent);display:grid;place-items:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--fg2);letter-spacing:0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.prose{display:grid;gap:10px;font-size:16px;line-height:1.45}
table{border-collapse:collapse;width:100%;font-size:15px}
td{padding:10px 0;border-bottom:.5px solid var(--sep);vertical-align:top}
tr:last-child td{border-bottom:0}
td.k{font-family:var(--f-mono);font-size:14px;white-space:nowrap;padding-right:14px;color:var(--accent);letter-spacing:0}
td.n{font-family:var(--f-mono);text-align:right;white-space:nowrap;letter-spacing:0}
.segbar{display:flex;height:36px;border-radius:10px;overflow:hidden;font-size:11px;font-family:var(--f-mono);letter-spacing:0}
.segbar div{display:grid;place-items:center;border-right:1px solid var(--surface);overflow:hidden;min-width:0}

/* 3D */
.m3{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 38%,var(--surface) 0%,var(--bg) 75%)}
.m3 canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.m3 .nav{background:none;box-shadow:none}
.m3panel{position:absolute;left:max(12px,var(--sal));right:max(12px,var(--sar));bottom:calc(var(--sab) + 12px);max-width:480px;margin:0 auto;padding:12px;border-radius:28px;display:grid;gap:12px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--glass-line),var(--shadow)}
.m3row{display:flex;align-items:center;gap:10px}
.seg{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:18px;padding:3px;position:relative}
.seg button{height:34px;border-radius:15px;font-size:15px;font-weight:500;position:relative;z-index:1;color:var(--fg)}
.seg button.on{background:var(--surface);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.tog{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--fg2);flex:none}
.tog.on{background:var(--accent-soft);color:var(--accent)}
.yarns{display:flex;gap:12px;justify-content:center}
.yarns button{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15);position:relative}
.yarns button.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--accent)}
.m3hint{position:absolute;left:0;right:0;text-align:center;font-size:13px;color:var(--fg2);pointer-events:none;letter-spacing:0}
.m3load{position:absolute;inset:0;display:grid;place-items:center;color:var(--fg2);font-size:15px}

.toast{position:fixed;left:50%;top:calc(var(--sat) + 10px);transform:translateX(-50%);z-index:40;padding:12px 18px;border-radius:24px;font-size:15px;font-weight:500;max-width:90vw;text-align:center;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--glass-line),var(--shadow);animation:drop .35s cubic-bezier(.2,.9,.25,1)}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg,#F2F4F7);color:var(--fg,#1b1f24);z-index:100}
#lock[hidden]{display:none}
#lock form{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;text-align:center}
#lock .t{font-size:34px;font-weight:700;margin-bottom:12px}
#lock input,#lock button{font:inherit;font-size:17px;height:52px;padding:0 18px;border-radius:14px;border:0;outline:none}
#lock input{background:var(--surface,#fff);color:inherit}
#lock button{background:var(--accent,#007AFF);color:#fff;font-weight:600;border-radius:26px}
#lock .err{color:var(--danger,#FF3B30);min-height:1.2em;font-size:15px}
@media (prefers-color-scheme:dark){#lock{background:var(--bg,#000);color:var(--fg,#fff)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="lock" hidden>
